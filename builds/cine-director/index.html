<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Cine Director</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #090b11; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #090b11; }
      #loader {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px;
        font: 500 12px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
        letter-spacing: .14em; text-transform: uppercase; text-align: center; color: #8e98ad;
      }
      #loader strong { font-size: 14px; color: #e9edf5; }
      #bar { width: min(60vw, 280px); height: 3px; border-radius: 3px; overflow: hidden; background: #262e42; }
      #fill { width: 0; height: 100%; background: #ff6a2b; transition: width .2s; }
      #loader.failed #bar { display: none; }
      #loader.failed #status { max-width: 80vw; letter-spacing: 0; text-transform: none; color: #ff8a56; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <strong>Cine Director</strong>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading</div>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      // Fills whatever it is given: a browser tab, or the player iframe on the portfolio site.
      var canvas = document.getElementById("unity-canvas");
      var loader = document.getElementById("loader");
      var status = document.getElementById("status");

      function fail(message) {
        loader.classList.add("failed");
        status.textContent = String(message);
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ravi Chaudhary",
        productName: "Cine Director",
        productVersion: "0.1.0",
        // Saves are written through to the browser's storage as they happen.
        autoSyncPersistentDataPath: true,
        // 3x phone screens triple the fill cost for very little visible gain.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) {
          if (type === "error") fail(message);
          else console.warn(message);
        },
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loader.remove();
        canvas.focus();
      }).catch(fail);
    </script>
  </body>
</html>
